    #   - 非对称算法（RS256 等）：private_key 签发、public_key 校验。
    method: "RS256"
    # 对称算法时使用（HS256 等），RS256 下留空。
    key: ""
    # access/refresh token 过期时间（protobuf Duration 字符串），未配置时使用代码默认值。
    access_token_expires: 5400s      # 1.5 小时
