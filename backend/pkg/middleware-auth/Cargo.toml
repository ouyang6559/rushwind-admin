[package]
name = "middleware-auth"
description = "The protected-subtree auth gate — the port of the reference pkg/middleware/auth: credential verification through the framework engine contract, failures rendered as the four-field status envelope with the admin error tables' UNAUTHORIZED pairing and the reference's exact message literals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
admin-api = { path = "../../api/admin-api" }
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "dd5bc3b87870a946ca56a20849634fb0d8d7fa9f" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "dd5bc3b87870a946ca56a20849634fb0d8d7fa9f" }
axum = { version = "0.8", default-features = false }
