[workspace]
resolver = "2"
members = ["api/admin-api", "app/admin/service", "pkg/*", "testbed/admin-diff"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.81"
license = "MIT"

[workspace.dependencies]
# proto 类型链——版本与 rushwind 工作区保持一致（prost 0.14 / pbjson 0.9 / protox 0.9）。
prost = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
protox = "0.9"
serde = "1"
serde_json = "1"
# 生成器与运行时 schema 面：prost-reflect（描述符池 + 动态消息 + 扩展选项解码）。
prost-reflect = { version = "0.16", features = ["serde"] }
# 生成器产物中的服务 trait 用 async-trait 保证 dyn 兼容。
async-trait = "0.1"
# 管理服务直用的工具链：Django 风格 query 解析（go-utils/query_parser 同源移植）。
rust-utils = { path = "../../rust-utils", features = ["json"] }
# captcha 图像渲染（base64Captcha 的等价渲染面）。
captcha = "0.0.9"
sha1 = "0.10"
# binder 叶子解码：std base64（Go StdEncoding 同语义）与 RFC3339 时间戳解析。
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 存储面（版本与 rushwind 工作区一致；with-chrono/with-json 供实体时间戳/JSONB 列）。
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "macros",
    "with-chrono",
    "with-json",
] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
bcrypt = "0.15"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.9"
hex = "0.4"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
